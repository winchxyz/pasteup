<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pasteup</title>
  <meta name="description" content="Lay out pictures for X before you post: ready layouts for 1 to 20 pictures, one picture cut across a row, avatar and banner, picture sizes. Dark and light preview.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1b1b1d">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pasteup">
  <meta property="og:description" content="Lay out pictures for X before you post them.">
  <meta property="og:url" content="https://winchxyz.github.io/pasteup/">
  <meta property="og:image" content="https://winchxyz.github.io/pasteup/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="backdrop" class="backdrop" aria-hidden="true"></div>
  <div id="window" class="window">
    <nav class="rail" aria-label="Sections">
      <a class="mark" href="./" aria-label="Pasteup">
        <!-- a P pasted up from four pieces, with the gap the feed leaves between pictures -->
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><rect x="2" y="2" width="5" height="20"/><rect x="9" y="2" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/><path d="M16 2a6 6 0 0 1 0 12Z"/></svg>
      </a>
      <span class="mark-name" aria-hidden="true">Pasteup</span>
      <div id="modes" class="rail-nav"></div>
      <div id="rail-foot" class="rail-foot"></div>
    </nav>
    <div class="main">
      <header class="top">
        <div id="title" class="title"></div>
        <div id="switches" class="switches"></div>
        <div id="actions" class="actions"></div>
      </header>
      <main id="desk" class="desk">
        <aside id="panel" class="panel" aria-label="Layouts"></aside>
        <div id="stage" class="stage" aria-label="Preview"></div>
        <aside id="tools" class="panel is-right" aria-label="Pictures" hidden></aside>
      </main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
