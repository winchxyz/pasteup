<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pasteup</title>
  <meta name="description" content="Lay out pictures for X before you post: ready layouts for 1 to 20 pictures, one picture cut across a row, avatar and banner, picture sizes. Dark and light preview.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1b1b1d">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pasteup">
  <meta property="og:description" content="Lay out pictures for X before you post them.">
  <meta property="og:url" content="https://winchxyz.github.io/pasteup/">
  <meta property="og:image" content="https://winchxyz.github.io/pasteup/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="backdrop" class="backdrop" aria-hidden="true"></div>
  <div id="window" class="window">
    <nav class="rail" aria-label="Sections">
      <a class="mark" href="./" aria-label="Pasteup">
        <!-- a P pasted up from four pieces, with the gap the feed leaves between pictures -->
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><rect x="2" y="2" width="5" height="20"/><rect x="9" y="2" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/><path d="M16 2a6 6 0 0 1 0 12Z"/></svg>
      </a>
      <span class="mark-name" aria-hidden="true">Pasteup</span>
      <div id="modes" class="rail-nav"></div>
      <div id="rail-foot" class="rail-foot"></div>
      <a class="rail-btn rail-star" href="https://github.com/winchxyz/pasteup" target="_blank" rel="noopener" title="Star on GitHub" aria-label="Star on GitHub">
        <svg viewBox="0 0 16 16" width="21" height="21" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.780-.2 3.650-.88 3.650-3.950 0-.88-.31-1.590-.82-2.150.08-.2.36-1.020-.08-2.120 0 0-.67-.22-2.200.82-.64-.18-1.320-.27-2-.27-.68 0-1.360.09-2 .27-1.530-1.030-2.200-.82-2.200-.82-.44 1.100-.16 1.920-.08 2.120-.51.56-.82 1.280-.82 2.150 0 3.060 1.860 3.750 3.640 3.950-.23.2-.44.55-.51 1.070-.46.21-1.610.55-2.330-.66-.15-.24-.6-.83-1.230-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.130.16.45.68 1.310 2.690.94 0 .67.01 1.300.01 1.490 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.420 3.580-8 8-8Z"/></svg>
        <svg class="rail-star-mark" viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="m12 2.6 2.9 5.9 6.500.9-4.700 4.600 1.100 6.500L12 17.400l-5.800 3.100 1.100-6.500L2.600 9.400l6.500-.9Z"/></svg>
      </a>
    </nav>
    <div class="main">
      <header class="top">
        <div id="title" class="title"></div>
        <div id="switches" class="switches"></div>
        <div id="actions" class="actions"></div>
      </header>
      <main id="desk" class="desk">
        <aside id="panel" class="panel" aria-label="Layouts"></aside>
        <div id="stage" class="stage" aria-label="Preview"></div>
        <aside id="tools" class="panel is-right" aria-label="Pictures" hidden></aside>
      </main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
